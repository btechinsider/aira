name: AIRA CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          cd aira/backend
          pip install -r requirements.txt
      
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 aira/backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 aira/backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: aira/frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd aira/frontend
          npm ci
      
      - name: Lint frontend
        run: |
          cd aira/frontend
          npm run lint || true
      
      - name: Build frontend
        run: |
          cd aira/frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Backend Docker image
        run: |
          cd aira
          docker build -f docker/Dockerfile.backend -t aira-backend:test .
      
      - name: Build Frontend Docker image
        run: |
          cd aira
          docker build -f docker/Dockerfile.frontend -t aira-frontend:test .
      
      - name: Build GitHub MCP Docker image
        run: |
          cd aira/mcp-servers/github_mcp
          docker build -t aira-github-mcp:test .
      
      - name: Build Incident Context MCP Docker image
        run: |
          cd aira/mcp-servers/incident_context_mcp
          docker build -t aira-incident-context-mcp:test .

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'aira'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

